<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEAMATE IMUCET Mock Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#1e3b5a; --navy-d:#122439; --gold:#3d6690; --bg:#f7f9fb; --card:#ffffff;
  --text:#16232f; --muted:#5c6f7f; --green:#1f9d55; --red:#d9453d; --purple:#7c4dff; --grey:#ccd4db;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100%;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a1520;--card:#122032;--text:#e8edf3;--muted:#8fa0b3;}
}
:root[data-theme="dark"]{--bg:#0a1520;--card:#122032;--text:#e8edf3;--muted:#8fa0b3;}
img{max-width:100%;}
.container{max-width:900px;margin:0 auto;padding:16px;}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:22px;margin-bottom:16px;}
.center{text-align:center;}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;}
.brand img{width:56px;height:56px;border-radius:50%;}
.brand h1{color:var(--navy);font-size:1.3rem;margin:0;}
:root[data-theme="dark"] .brand h1{color:#8fb4e8;}
.brand small{color:var(--muted);display:block;font-weight:400;}
label{display:block;margin:12px 0 6px;font-weight:600;font-size:.92rem;}
input[type=text],input[type=tel],input[type=email],input[type=password]{
  width:100%;padding:12px;border:1.5px solid var(--grey);border-radius:8px;font-size:1rem;background:var(--card);color:var(--text);
}
button{cursor:pointer;border:none;border-radius:8px;padding:12px 20px;font-size:.98rem;font-weight:600;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-d);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
:root[data-theme="dark"] .btn-outline{color:#8fb4e8;border-color:#8fb4e8;}
.btn-danger{background:var(--red);color:#fff;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;}
ul.instr li{margin-bottom:9px;line-height:1.4;}
.badge{display:inline-block;background:var(--navy);color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;margin:3px 4px 3px 0;}
.badge.gold{background:var(--gold);color:#20281a;}
/* Exam layout */
#examTop{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
#examTop .who{display:flex;align-items:center;gap:8px;font-size:.85rem;}
#examTop img{width:30px;height:30px;border-radius:50%;}
#timer{font-weight:700;background:#0a1f3d;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;}
#timer.low{background:var(--red);}
.examWrap{display:flex;gap:14px;padding:14px;max-width:1200px;margin:0 auto;align-items:flex-start;}
#qPane{flex:1;min-width:0;}
#navPane{position:fixed;top:80px;right:16px;width:260px;z-index:50;max-height:78vh;}
@media (max-width:600px){#navPane{width:min(260px,calc(100vw - 24px));right:12px;top:76px;}}
.qcard{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-bottom:8px;}
.qtext{font-size:1.05rem;line-height:1.5;margin-bottom:16px;white-space:pre-wrap;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--grey);border-radius:9px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.opt:hover{border-color:var(--navy);}
.opt.sel{border-color:var(--navy);background:rgba(18,48,92,.08);}
.opt input{margin-top:3px;}
.navRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.navRow button{flex:1;min-width:90px;}
#gridWrap{background:var(--card);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;max-height:78vh;}
#gridWrap h4{margin:4px 0 10px;font-size:.9rem;}
#gridHandle{cursor:grab;background:var(--navy);color:#fff;padding:9px 12px;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;user-select:none;touch-action:none;}
#gridHandle:active{cursor:grabbing;}
#gridHandle span{opacity:.85;}
#gridCollapseBtn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:6px;width:24px;height:24px;font-size:1rem;line-height:1;padding:0;}
#gridBody{padding:12px;overflow-y:auto;}
#gridBody.collapsed{display:none;}
.legend{font-size:.72rem;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.sectionLabel{font-size:.75rem;font-weight:700;color:var(--muted);margin:8px 0 4px;}
#qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;}
.gq{aspect-ratio:1;border-radius:6px;border:none;font-size:.72rem;font-weight:700;color:#fff;background:var(--grey);}
.gq.visited{background:var(--red);}
.gq.answered{background:var(--green);}
.gq.review{background:var(--purple);}
.gq.answered.review{background:linear-gradient(135deg,var(--green) 50%,var(--purple) 50%);}
.gq.current{outline:2.5px solid var(--gold);}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
table th,table td{border:1px solid var(--grey);padding:6px 8px;text-align:left;}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0;}
@media(min-width:600px){.statgrid{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center;}
.stat b{font-size:1.3rem;display:block;color:var(--navy);}
:root[data-theme="dark"] .stat b{color:#8fb4e8;}
.warnModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.warnBox{background:var(--card);border-radius:14px;padding:24px;max-width:380px;text-align:center;}
canvas{max-width:100%;}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px;}
a.link{color:var(--navy);}
</style>
</head>

function tick(){

  if(t) t.textContent=fmtTime(state.remaining);
  if(t && state.remaining<300) t.classList.add('low');
}
function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}
function renderExam(){

function applyGridPos(){

  if(panel && state.gridPos){
    panel.style.right='auto';

    panel.style.top=state.gridPos.top;

function makeDraggable(handleId,panelId){
  const handle=document.getElementById(handleId);
  const panel=document.getElementById(panelId);
  if(!handle||!panel) return;
  let sx,sy,ox,oy,dragging=false;
  function start(e){
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY;
    const rect=panel.getBoundingClientRect();
    ox=rect.left; oy=rect.top;
    panel.style.right='auto'; panel.style.left=ox+'px'; panel.style.top=oy+'px';
    document.addEventListener('mousemove',move); document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('mouseup',end); document.addEventListener('touchend',end);
  }
  function move(e){
    if(!dragging) return;
    if(e.cancelable) e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    const dx=p.clientX-sx, dy=p.clientY-sy;
    let nx=ox+dx, ny=oy+dy;
    nx=Math.max(4,Math.min(window.innerWidth-panel.offsetWidth-4,nx));
    ny=Math.max(4,Math.min(window.innerHeight-40,ny));
    panel.style.left=nx+'px'; panel.style.top=ny+'px';
  }
  function end(){
    if(!dragging) return;
    dragging=false;
    state.gridPos={left:panel.style.left,top:panel.style.top};
    document.removeEventListener('mousemove',move); document.removeEventListener('touchmove',move);
    document.removeEventListener('mouseup',end); document.removeEventListener('touchend',end);
  }
  handle.addEventListener('mousedown',start);
  handle.addEventListener('touchstart',start,{passive:true});
}
function renderGrid(){
  let html="";
  let idx=0;
  for(const sec of SECTIONS){
    html+=`<div class="sectionLabel">${sec}</div><div id="qgrid">`;
    QUESTIONS.forEach((q,i)=>{

      let cls="gq";
      if(state.visited[q.id]) cls+=" visited";
      if(state.answers[q.id]!==undefined) cls+=" answered";
      if(state.review[q.id]) cls+=" review";
      if(i===state.current) cls+=" current";
      html+=`<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
    });
    html+="</div>";
  }
  return html;
}

function clearResp(){ const q=QUESTIONS[state.current]; delete state.answers[q.id]; renderExam(); }
function toggleReview(){ const q=QUESTIONS[state.current]; state.review[q.id]=!state.review[q.id]; renderExam(); }
function goTo(i){ state.current=i; renderExam(); window.scrollTo(0,0); }
function nextOrSubmit(){ if(state.current<199){ goTo(state.current+1); } else { confirmSubmit(); } }

/* ---------- ANTI CHEAT ---------- */
function attachAntiCheat(){
  document.addEventListener('visibilitychange', onVis);
  document.addEventListener('contextmenu', e=>{ e.preventDefault(); state.rightClickAttempts++; });
  document.addEventListener('copy', ()=>{ state.copyAttempts++; });
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && ['c','u','s','p'].includes(e.key.toLowerCase())){ e.preventDefault(); state.copyAttempts++; }
    if(e.key==='F12'){ e.preventDefault(); state.copyAttempts++; }
  });
}
function onVis(){
  if(document.hidden && !state.submitted){
    state.tabSwitches++;
    if(state.tabSwitches>=4){
      finishExam(false,true);
    } else {
      showWarning();
    }
  }
}
function showWarning(){
  const box=document.createElement('div');
  box.className='warnModal';
  box.innerHTML=`<div class="warnBox">
    <h3 style="color:var(--red);">⚠ Warning ${state.tabSwitches}/3</h3>
    <p>Tab/app switch detected. Switching tabs more than <b>3 times</b> will <b>auto-submit</b> your test and be flagged as a cheating attempt.</p>
    <button class="btn-primary" onclick="this.closest('.warnModal').remove()">I Understand, Continue</button>
  </div>`;
  document.body.appendChild(box);
}

/* ---------- FINISH / RESULTS ---------- */
function finishExam(timeUp,disqualified){
  if(state.submitted) return;
  state.submitted=true;
  state.disqualified=!!disqualified;
  state.submitTime=Date.now();
  clearInterval(state.timerInterval);
  document.removeEventListener('visibilitychange', onVis);
  computeResult();
  saveToDB();
  screenResults(timeUp,disqualified);
}
let RESULT=null;
function computeResult(){
  let correct=0, incorrect=0, attempted=0;
  const bySec={Physics:{c:0,i:0,total:0},Chemistry:{c:0,i:0,total:0},Mathematics:{c:0,i:0,total:0}};
  QUESTIONS.forEach(q=>{
    bySec[q.s].total++;
    const ans=state.answers[q.id];
    if(ans===undefined) return;
    attempted++;
    if(ans===q.a){ correct++; bySec[q.s].c++; } else { incorrect++; bySec[q.s].i++; }
  });
  const marks = correct*1 - incorrect*0.25;
  const pct = (marks/200*100);
  const elapsedSec = Math.round((state.submitTime-state.startTime)/1000);
  RESULT = {
    name:state.candidate.name, mobile:state.candidate.mobile, email:state.candidate.email,
    correct, incorrect, attempted, unattempted:200-attempted, marks:Math.round(marks*100)/100,
    percentage: Math.round(pct*100)/100, elapsedSec, bySec,
    tabSwitches:state.tabSwitches, copyAttempts:state.copyAttempts, rightClickAttempts:state.rightClickAttempts,
    disqualified:state.disqualified, date:new Date().toLocaleString(),
    passFail: pct>=40 ? 'PASS' : 'FAIL'
  };
}
function saveToDB(){
  const db = loadLocal('seamate_results', []);

}

  let csv=headers.join(',')+'\n';
  db.forEach(r=>{ csv+=headers.map(h=>`"${(''+r[h]).replace(/"/g,'""')}"`).join(',')+'\n'; });
  downloadBlob(csv,'seamate_results.csv','text/csv');
}
function exportJSON(){
  const db=loadLocal('seamate_results',[]);
  downloadBlob(JSON.stringify(db,null,2),'seamate_results.json','application/json');
}
function downloadBlob(content,filename,type){
  const blob=new Blob([content],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
}
function clearDB(){
  if(confirm('This will permanently delete all stored results on this device. Continue?')){
    saveLocal('seamate_results',[]); screenAdminDash();
  }
}

screenRegister();
</script>
